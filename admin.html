<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beheer dataconsultants.eu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Beheer van de teksten op de beginpagina (24-11-2026, Anne: "maak een admingedeelte waar ik de teksten kan aanpassen").
   Leest teksten.json, toont elk veld als invoerveld, bewaart via POST /api/teksten op de lokale server (serve.py).
   Op GitHub Pages is bewaren niet mogelijk: dan "Download" en het bestand in de repository zetten.
   Tab Koppelingen (25-11-2026, Anne: "brevo ideal api data zien vanuit de admin tool"): POST /api/beheer bij de contactdienst op de server,
   die met de sleutels van zijn instellingenpagina bij Brevo en Mollie leest; hier komt alleen het resultaat, nooit een sleutel. */
:root { --papier:#f3eee4; --papier-diep:#eae3d5; --lijn:#d8cfbd; --inkt:#26231f; --inkt-licht:#5f5a51; --potlood:#8a8378; --stempel:#9b2f24; --groen:#3f6b3a; --veld:#fbf8f2; }
@media (prefers-color-scheme: dark) { :root { --papier:#1c1b18; --papier-diep:#22201c; --lijn:#3a362f; --inkt:#e9e3d6; --inkt-licht:#b5ad9e; --potlood:#8c8578; --stempel:#d26a5c; --groen:#8fbf86; --veld:#16150f; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Courier Prime", monospace; font-size: 15px; line-height: 1.5; color: var(--inkt); background: var(--papier); }
.tw { font-family: "Special Elite", monospace; font-weight: 400; }
.hand { font-family: "Caveat", cursive; color: var(--inkt-licht); }
header { position: sticky; top: 0; z-index: 5; background: var(--papier); border-bottom: 1px solid var(--lijn); }
.balk { max-width: 980px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.balk h1 { font-size: 1.1rem; flex: 1; }
.balk h1 small { font-family: "Caveat", cursive; font-size: 1rem; color: var(--potlood); margin-left: 8px; }
button, .knop { font: inherit; font-size: .85rem; padding: 7px 14px; border: 1px solid var(--inkt); background: transparent; color: var(--inkt); cursor: pointer; border-radius: 3px; }
button.primair { background: var(--inkt); color: var(--papier); }
button.klein { font-size: .75rem; padding: 3px 9px; border-color: var(--potlood); color: var(--inkt-licht); }
button:disabled { opacity: .5; cursor: default; }
#status { font-size: .85rem; color: var(--inkt-licht); min-width: 160px; }
#status.goed { color: var(--groen); } #status.fout { color: var(--stempel); }
main { max-width: 980px; margin: 0 auto; padding: 20px 20px 80px; }
.blok { background: var(--papier-diep); border: 1px solid var(--lijn); padding: 18px 20px; margin-bottom: 22px; }
.blok h2 { font-size: 1.2rem; margin-bottom: 4px; }
.blok h2::before { content: "// "; color: var(--potlood); }
.blok .uitleg { font-size: .85rem; color: var(--potlood); margin-bottom: 12px; }
label { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--potlood); margin: 10px 0 3px; }
input[type=text], textarea, select { width: 100%; font: inherit; font-size: .95rem; padding: 7px 9px; border: 1px solid var(--lijn); background: var(--veld); color: var(--inkt); border-radius: 2px; }
textarea { min-height: 72px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 1.5px solid var(--groen); border-color: var(--groen); }
.kaart { border: 1px dashed var(--potlood); padding: 12px 14px 14px; margin-top: 14px; background: var(--papier); }
.kaart-kop { display: flex; align-items: center; gap: 8px; }
.kaart-kop .nr { font-family: "Special Elite", monospace; color: var(--potlood); }
.kaart-kop strong { flex: 1; font-weight: 400; font-family: "Special Elite", monospace; font-size: 1.05rem; }
.twee { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 700px) { .twee { grid-template-columns: 1fr; } }
.links-uitleg { font-size: .78rem; color: var(--potlood); margin-top: 2px; }
.voet-knoppen { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
#wachtwoord { max-width: 420px; margin: 80px auto; text-align: center; }
#wachtwoord input { max-width: 260px; margin: 10px auto; display: block; text-align: center; }
.verborgen { display: none !important; }
.tabs { display: flex; gap: 2px; }
.tabs button { border-color: var(--lijn); color: var(--inkt-licht); }
.tabs button.actief { border-color: var(--inkt); color: var(--inkt); background: var(--papier-diep); }
table.k { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 4px; }
.k th, .k td { text-align: left; padding: 4px 6px; border-bottom: 1px dashed var(--lijn); vertical-align: top; }
.k th { font-weight: 400; color: var(--potlood); text-transform: uppercase; font-size: .72rem; letter-spacing: .06em; }
.k .cijfer { text-align: right; white-space: nowrap; }
.stat { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 6px; }
.stat div { background: var(--papier); border: 1px dashed var(--potlood); padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-family: "Special Elite", monospace; font-size: 1.25rem; font-weight: 400; overflow-wrap: anywhere; }
.stat span { font-size: .72rem; color: var(--potlood); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>

<header>
    <div class="balk">
        <h1 class="tw">Beheer <small>dataconsultants.eu</small></h1>
        <nav class="tabs" id="tabs" aria-label="Onderdelen">
            <button type="button" class="actief" data-tab="teksten">Teksten</button>
            <button type="button" data-tab="koppelingen">Koppelingen</button>
        </nav>
        <span id="status"></span>
        <a class="knop" href="index.html" target="_blank" rel="noopener">Bekijk pagina</a>
        <button id="download" type="button">Download</button>
        <button id="opslaan" type="button" class="primair" disabled>Opslaan</button>
    </div>
</header>

<main>
    <div id="wachtwoord" class="blok">
        <h2 class="tw">Wachtwoord</h2>
        <p class="uitleg">Op de live site: het beheerwachtwoord van de instellingenpagina van de contactdienst; het wordt bij elke opslag gecontroleerd. Op de laptop (localhost) volstaat elk woord: daar schrijft de lokale server teksten.json.</p>
        <input type="password" id="ww" placeholder="wachtwoord" autocomplete="current-password">
        <button type="button" id="ww-knop" class="primair">Verder</button>
    </div>
    <div id="formulier" class="verborgen"></div>
    <div id="koppelingen" class="verborgen"></div>
</main>

<script>
(function () {
    // Lokaal (localhost:8087) bewaart serve.py zonder controle; op de live site controleert de contactdienst het beheerwachtwoord
    // dat op de instellingenpagina is gezet. Het ingetypte wachtwoord gaat mee met elke opslag.
    let wachtwoord = "";
    const status = document.getElementById("status");
    const vorm = document.getElementById("formulier");
    const kop = document.getElementById("koppelingen");
    const knopOpslaan = document.getElementById("opslaan");
    let T = null, gewijzigd = false;

    const zeg = (tekst, soort) => { status.textContent = tekst; status.className = soort || ""; };
    const markeer = () => { gewijzigd = true; knopOpslaan.disabled = false; zeg("niet opgeslagen"); };
    const el = (tag, klasse, tekst) => { const n = document.createElement(tag); if (klasse) n.className = klasse; if (tekst != null) n.textContent = tekst; return n; };

    // invoerveld dat rechtstreeks in het model schrijft
    function veld(ouder, naam, obj, sleutel, soort, uitleg) {
        ouder.appendChild(el("label", null, naam));
        let inv;
        if (soort === "tekst") { inv = el("textarea"); inv.value = obj[sleutel] || ""; }
        else if (soort === "stempel") {
            inv = el("input"); inv.type = "text"; inv.value = obj[sleutel] || ""; inv.setAttribute("list", "stempels");
        } else { inv = el("input"); inv.type = "text"; inv.value = obj[sleutel] || ""; }
        inv.addEventListener("input", () => { obj[sleutel] = inv.value; markeer(); });
        ouder.appendChild(inv);
        if (uitleg) ouder.appendChild(el("div", "links-uitleg", uitleg));
        return inv;
    }
    // links als regels "tekst | adres"
    function linksVeld(ouder, obj) {
        ouder.appendChild(el("label", null, "Links (een per regel: tekst | adres)"));
        const ta = el("textarea"); ta.value = (obj.links || []).map(l => `${l.tekst} | ${l.href}`).join("\n");
        ta.addEventListener("input", () => {
            obj.links = ta.value.split("\n").map(r => r.trim()).filter(Boolean).map(r => { const [tekst, href] = r.split("|").map(s => s.trim()); return { tekst: tekst || href || "", href: href || "#" }; });
            markeer();
        });
        ouder.appendChild(ta);
    }

    function bouw() {
        vorm.innerHTML = "";
        // site en begin
        let b = el("div", "blok"); b.appendChild(el("h2", "tw", "Kop en begin"));
        b.appendChild(el("p", "uitleg", "De naam staat linksboven; de kopregel wordt getypt. In de intro mag een beetje HTML: <strong> en <a href=\"#conversietheorie\">."));
        let g = el("div", "twee"); veld(g, "Naam", T.site, "naam"); veld(g, "Plaats (handschrift naast de naam)", T.site, "plaats"); b.appendChild(g);
        veld(b, "Beschrijving voor zoekmachines", T.site, "beschrijving", "tekst");
        // kopregels: een zin per regel; meerdere zinnen worden op de pagina na elkaar getypt
        b.appendChild(el("label", null, "Kopregels (een zin per regel; meerdere zinnen worden na elkaar getypt)"));
        const kr = el("textarea"); kr.value = (T.begin.kopregels && T.begin.kopregels.length ? T.begin.kopregels : [T.begin.kopregel || ""]).join("\n");
        kr.addEventListener("input", () => { T.begin.kopregels = kr.value.split("\n").map(s => s.trim()).filter(Boolean); T.begin.kopregel = T.begin.kopregels[0] || ""; markeer(); });
        b.appendChild(kr);
        veld(b, "Intro (HTML toegestaan)", T.begin, "intro_html", "tekst");
        g = el("div", "twee"); veld(g, "Kanttekening (handschrift, regeleinde toegestaan)", T.begin, "kantlijn", "tekst"); veld(g, "Onderschrift kanttekening", T.begin, "kantlijn_sub"); b.appendChild(g);
        vorm.appendChild(b);

        // menu
        b = el("div", "blok"); b.appendChild(el("h2", "tw", "Menu"));
        b.appendChild(el("p", "uitleg", "Een regel per menu-item: tekst | anker of adres. De ankers zijn #producten, #prototypes, #contact."));
        linksVeld(b, { get links() { return T.menu; }, set links(v) { T.menu = v; } });
        vorm.appendChild(b);

        // secties met kaarten
        T.secties.forEach((sec, si) => {
            const s = el("div", "blok");
            s.appendChild(el("h2", "tw", sec.titel || `Sectie ${si + 1}`));
            s.appendChild(el("p", "uitleg", `Anker #${sec.id}. Kaarten worden doorgenummerd over alle secties. Stempel groen bij "live" of "product", anders rood.`));
            g = el("div", "twee"); veld(g, "Titel van de sectie", sec, "titel"); veld(g, "Handschrift naast de titel", sec, "hand"); s.appendChild(g);
            veld(s, "Inleiding van de sectie (HTML toegestaan, alinea's met <p>)", sec, "intro_html", "tekst");
            const nummerLabel = el("label", null, "Kaarten nummeren"); s.appendChild(nummerLabel);
            const nummerKeuze = el("select"); ["ja", "nee"].forEach(v => { const o = el("option", null, v); o.value = v; nummerKeuze.appendChild(o); });
            nummerKeuze.value = sec.nummeren === false ? "nee" : "ja";
            nummerKeuze.addEventListener("change", () => { sec.nummeren = nummerKeuze.value === "ja"; markeer(); bouw(); });
            s.appendChild(nummerKeuze);
            sec.kaarten.forEach((k, ki) => {
                const kd = el("div", "kaart");
                const kop = el("div", "kaart-kop");
                kop.appendChild(el("span", "nr", sec.nummeren === false ? "-" : String(nummer(si, ki)).padStart(2, "0")));
                kop.appendChild(el("strong", null, k.titel || "(zonder titel)"));
                const omhoog = el("button", "klein", "omhoog"); omhoog.type = "button"; omhoog.disabled = ki === 0;
                omhoog.onclick = () => { sec.kaarten.splice(ki - 1, 0, sec.kaarten.splice(ki, 1)[0]); markeer(); bouw(); };
                const omlaag = el("button", "klein", "omlaag"); omlaag.type = "button"; omlaag.disabled = ki === sec.kaarten.length - 1;
                omlaag.onclick = () => { sec.kaarten.splice(ki + 1, 0, sec.kaarten.splice(ki, 1)[0]); markeer(); bouw(); };
                const weg = el("button", "klein", "verwijderen"); weg.type = "button";
                weg.onclick = () => { if (confirm(`Kaart "${k.titel}" verwijderen?`)) { sec.kaarten.splice(ki, 1); markeer(); bouw(); } };
                kop.append(omhoog, omlaag, weg); kd.appendChild(kop);
                g = el("div", "twee");
                const t = veld(g, "Titel", k, "titel"); t.addEventListener("input", () => { kop.querySelector("strong").textContent = k.titel || "(zonder titel)"; });
                veld(g, "Stempel", k, "stempel", "stempel"); kd.appendChild(g);
                veld(kd, "Tekst", k, "tekst", "tekst");
                veld(kd, "Kanttekening (handschrift)", k, "hand");
                veld(kd, "Id (voor een anker, zonder spaties)", k, "id");
                linksVeld(kd, k);
                s.appendChild(kd);
            });
            const nieuw = el("button", "klein", "kaart toevoegen"); nieuw.type = "button"; nieuw.style.marginTop = "12px";
            nieuw.onclick = () => { sec.kaarten.push({ id: "", titel: "Nieuw", stempel: "in aanbouw", tekst: "", hand: "", links: [] }); markeer(); bouw(); };
            s.appendChild(nieuw);
            vorm.appendChild(s);
        });

        // contact en voet
        b = el("div", "blok"); b.appendChild(el("h2", "tw", "Contact en voettekst"));
        g = el("div", "twee"); veld(g, "Titel", T.contact, "titel"); veld(g, "Handschrift naast de titel", T.contact, "hand"); b.appendChild(g);
        veld(b, "Tekst (HTML toegestaan)", T.contact, "tekst_html", "tekst");
        linksVeld(b, T.contact);
        // contactformulier (25-11-2026): teksten van het briefje; het versturen gaat via /api/contact op de server
        T.contact.formulier = T.contact.formulier || { kop: "Of schrijf het hier", naam: "Uw naam", email: "Uw e-mailadres", bericht: "Uw bericht", knop: "Verstuur", dank: "", fout: "" };
        const fm = T.contact.formulier;
        b.appendChild(el("p", "uitleg", "Formulier: de teksten van het briefje onder de contactlinks. Berichten komen binnen bij de contactdienst op de server (en per mail zodra SMTP is ingesteld)."));
        g = el("div", "twee"); veld(g, "Kop van het formulier", fm, "kop"); veld(g, "Tekst op de knop", fm, "knop"); b.appendChild(g);
        g = el("div", "twee"); veld(g, "Label naam", fm, "naam"); veld(g, "Label e-mail", fm, "email"); b.appendChild(g);
        veld(b, "Label bericht", fm, "bericht");
        g = el("div", "twee"); veld(g, "Melding na versturen", fm, "dank"); veld(g, "Melding als versturen mislukt", fm, "fout"); b.appendChild(g);
        g = el("div", "twee"); veld(g, "Voettekst", T.voet, "tekst"); veld(g, "Voettekst, handschrift", T.voet, "hand"); b.appendChild(g);
        vorm.appendChild(b);

        // keuzelijst voor stempels
        if (!document.getElementById("stempels")) {
            const dl = el("datalist"); dl.id = "stempels";
            ["live", "product", "in aanbouw", "binnenkort", "methode"].forEach(v => { const o = el("option"); o.value = v; dl.appendChild(o); });
            document.body.appendChild(dl);
        }
    }
    function nummer(si, ki) { let n = 0; for (let i = 0; i < si; i++) if (T.secties[i].nummeren !== false) n += T.secties[i].kaarten.length; return n + ki + 1; }

    async function laad() {
        try {
            // eerst de teksten die op de live site zijn bewaard (/api/teksten), anders teksten.json uit git (lokaal altijd)
            let r = await fetch("/api/teksten", { cache: "no-store" }).catch(() => null);
            const bron = r && r.ok ? "server" : "teksten.json";
            if (!r || !r.ok) r = await fetch("teksten.json", { cache: "no-store" });
            if (!r.ok) throw new Error(r.status);
            T = await r.json(); bouw(); zeg("geladen uit " + bron);
        } catch (e) { zeg("teksten niet te laden: " + e.message, "fout"); }
    }
    async function opslaan() {
        knopOpslaan.disabled = true; zeg("bezig met opslaan");
        try {
            // lokaal (serve.py) schrijft dit teksten.json; op de live site bewaart de contactdienst het op de server en controleert het wachtwoord
            const r = await fetch("/api/teksten", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...T, sleutel: wachtwoord }) });
            const a = await r.json().catch(() => ({}));
            if (!r.ok || !a.ok) throw new Error(a.fout || ("fout " + r.status));
            gewijzigd = false; zeg(`opgeslagen (${a.bytes} bytes)`, "goed");
        } catch (e) {
            knopOpslaan.disabled = false;
            zeg("opslaan mislukt: " + e.message, "fout");
        }
    }
    function download() {
        const blob = new Blob([JSON.stringify(T, null, 2) + "\n"], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "teksten.json"; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // Koppelingen: wat Brevo (mail) en Mollie (iDEAL) via de contactdienst op de server melden, plus de berichten uit het formulier.
    // Elk getal draagt zijn bron in het label; lokaal (serve.py) bestaat /api/beheer niet en zegt de tab dat.
    let koppelingenGeladen = false;
    const tabs = document.getElementById("tabs");
    tabs.addEventListener("click", e => {
        const b = e.target.closest("button[data-tab]"); if (!b || !wachtwoord) return;
        tabs.querySelectorAll("button").forEach(x => x.classList.toggle("actief", x === b));
        const teksten = b.dataset.tab === "teksten";
        vorm.classList.toggle("verborgen", !teksten); kop.classList.toggle("verborgen", teksten);
        document.getElementById("download").classList.toggle("verborgen", !teksten); knopOpslaan.classList.toggle("verborgen", !teksten);
        if (!teksten && !koppelingenGeladen) laadKoppelingen();
    });
    const nl = n => (n == null || n === "") ? "-" : Number(n).toLocaleString("nl-NL");
    const euro = (v, c) => (v == null || v === "") ? "-" : Number(v).toLocaleString("nl-NL", { style: "currency", currency: c || "EUR" });
    const tijd = t => t ? new Date(t).toLocaleString("nl-NL", { dateStyle: "short", timeStyle: "short" }) : "-";
    function tabel(ouder, kolommen, rijen, leeg) {
        if (!Array.isArray(rijen) || !rijen.length) { ouder.appendChild(el("p", "uitleg", leeg || "geen gegevens")); return; }
        const t = el("table", "k"); const hr = el("tr");
        kolommen.forEach(k => hr.appendChild(el("th", k.cijfer ? "cijfer" : null, k.kop))); t.appendChild(hr);
        rijen.forEach(r => { const tr = el("tr"); kolommen.forEach(k => tr.appendChild(el("td", k.cijfer ? "cijfer" : null, String(k.waarde(r) ?? "-")))); t.appendChild(tr); });
        ouder.appendChild(t);
    }
    function tegels(ouder, items) {
        const g = el("div", "stat");
        items.forEach(([label, waarde]) => { const d = el("div"); d.appendChild(el("b", null, String(waarde ?? "-"))); d.appendChild(el("span", null, label)); g.appendChild(d); });
        ouder.appendChild(g);
    }
    function blok(titel, uitleg) { const b = el("div", "blok"); b.appendChild(el("h2", "tw", titel)); if (uitleg) b.appendChild(el("p", "uitleg", uitleg)); kop.appendChild(b); return b; }
    const foutVan = x => (x && !Array.isArray(x) && x.fout) ? x.fout : "";
    async function laadKoppelingen() {
        kop.innerHTML = ""; blok("Koppelingen", "bezig met ophalen bij de contactdienst, Brevo en Mollie");
        let d;
        try {
            const r = await fetch("/api/beheer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sleutel: wachtwoord }) });
            d = await r.json().catch(() => ({}));
            if (!r.ok || !d.ok) throw new Error(d.fout || ("fout " + r.status));
        } catch (e) {
            kop.innerHTML = "";
            blok("Koppelingen", "Niet beschikbaar: " + e.message + ". Dit overzicht werkt op de live site (de contactdienst op de server haalt de gegevens op); op de laptop bestaat /api/beheer niet.");
            return;
        }
        koppelingenGeladen = true; kop.innerHTML = "";
        const o = d.overzicht || {};
        let b = blok("Stand", "Bron: de contactdienst op de server (instellingenpagina en berichten.jsonl), opgehaald " + tijd(d.tijd) + ".");
        tegels(b, [["doormailen (SMTP)", o.mail_ingesteld ? "ingesteld" : "nog niet"], ["naar", o.mail_naar || "-"], ["Brevo-sleutel", o.brevo_ingesteld ? "ingesteld" : "nog niet"],
                   ["Mollie-sleutel", o.mollie_ingesteld ? "ingesteld" : "nog niet"], ["berichten via het formulier", nl(o.berichten_aantal)], ["waarvan gemaild", nl(o.berichten_gemaild)]]);
        b.appendChild(el("p", "uitleg", "Sleutels invoeren of wijzigen: op de instellingenpagina van de contactdienst (het adres met de contactsleutel staat in uw prive-notities). De sleutels komen nooit naar deze pagina."));
        const ververs = el("button", "klein", "opnieuw ophalen"); ververs.type = "button"; ververs.onclick = laadKoppelingen; b.appendChild(ververs);

        const br = d.brevo || {};
        b = blok("Brevo (mail)", br.ok ? "Bron: Brevo API v3, account en smtp/statistics, " + br.periode + "." : "Niet opgehaald: " + (br.fout || "onbekend"));
        if (br.ok) {
            const a = br.account || {}; const st = Array.isArray(br.statistiek) ? {} : (br.statistiek || {});
            tegels(b, [["account", a.email || "-"], ["bedrijf", a.bedrijf || "-"], ...(a.plan || []).map(x => ["plan " + x.soort, x.credits == null ? "-" : nl(x.credits) + " " + (x.credits_soort || "")])]);
            b.appendChild(el("label", null, "Transactionele mail, laatste 30 dagen (aggregatedReport)" + (st.fout ? ", niet opgehaald: " + st.fout : "")));
            tegels(b, [["aangeboden", nl(st.requests)], ["afgeleverd", nl(st.delivered)], ["geopend", nl(st.opens)], ["geklikt", nl(st.clicks)],
                       ["hard bounce", nl(st.hardBounces)], ["soft bounce", nl(st.softBounces)], ["geblokkeerd", nl(st.blocked)], ["spamklacht", nl(st.spamReports)]]);
            b.appendChild(el("label", null, "Laatste gebeurtenissen (smtp/statistics/events, nieuwste eerst)"));
            tabel(b, [{ kop: "tijd", waarde: r => tijd(r.tijd) }, { kop: "gebeurtenis", waarde: r => r.gebeurtenis }, { kop: "aan", waarde: r => r.aan },
                      { kop: "onderwerp", waarde: r => r.onderwerp }, { kop: "reden", waarde: r => r.reden || "" }], br.gebeurtenissen, foutVan(br.gebeurtenissen) || "nog geen mail in de laatste 30 dagen");
            b.appendChild(el("label", null, "Afzenders (senders)"));
            tabel(b, [{ kop: "naam", waarde: r => r.naam }, { kop: "e-mail", waarde: r => r.email }, { kop: "actief", waarde: r => r.actief ? "ja" : "nee" }], br.afzenders, foutVan(br.afzenders) || "geen afzenders");
        }

        const mo = d.mollie || {};
        b = blok("iDEAL via Mollie", mo.ok ? "Bron: Mollie API v2 (payments, balances, methods, organizations/me), modus " + mo.modus + "."
                                            : "Niet opgehaald: " + (mo.fout || "onbekend") + (mo.modus ? " (modus " + mo.modus + ")" : ""));
        if (mo.ok) {
            const org = Array.isArray(mo.organisatie) ? {} : (mo.organisatie || {});
            tegels(b, [["organisatie", org.naam || (org.fout ? "niet op te vragen" : "-")], ["KvK", org.kvk || "-"], ["btw", org.btw || "-"], ["iDEAL", mo.ideal_actief ? "actief" : "niet actief"],
                       ["betalingen (laatste 25 opgehaald)", nl(Array.isArray(mo.betalingen) ? mo.betalingen.length : null)]]);
            b.appendChild(el("label", null, "Saldi (balances)"));
            tabel(b, [{ kop: "valuta", waarde: r => r.valuta }, { kop: "beschikbaar", cijfer: true, waarde: r => euro(r.beschikbaar, r.valuta) },
                      { kop: "onderweg", cijfer: true, waarde: r => euro(r.onderweg, r.valuta) }, { kop: "status", waarde: r => r.status }], mo.saldi, foutVan(mo.saldi) ? "balances: " + foutVan(mo.saldi) : "geen saldo");
            b.appendChild(el("label", null, "Betaalmethoden (methods, ingeschakeld op het profiel)"));
            b.appendChild(el("p", "uitleg", Array.isArray(mo.methoden) && mo.methoden.length ? mo.methoden.map(m => m.naam || m.id).join(", ") : "geen, of niet op te vragen: " + (foutVan(mo.methoden) || "-")));
            b.appendChild(el("label", null, "Laatste betalingen (payments, nieuwste eerst)"));
            tabel(b, [{ kop: "aangemaakt", waarde: r => tijd(r.aangemaakt) }, { kop: "status", waarde: r => r.status }, { kop: "bedrag", cijfer: true, waarde: r => euro(r.bedrag, r.valuta) },
                      { kop: "methode", waarde: r => r.methode || "-" }, { kop: "omschrijving", waarde: r => r.omschrijving }, { kop: "modus", waarde: r => r.modus }], mo.betalingen, "nog geen betalingen");
        }

        b = blok("Berichten uit het contactformulier", "Bron: berichten.jsonl van de contactdienst, nieuwste eerst, hoogstens 100.");
        tabel(b, [{ kop: "tijd", waarde: r => tijd(r.tijd) }, { kop: "naam", waarde: r => r.naam }, { kop: "e-mail", waarde: r => r.email },
                  { kop: "bericht", waarde: r => r.bericht }, { kop: "gemaild", waarde: r => r.gemaild ? "ja" : "nee" }], d.berichten, "nog geen berichten");
    }

    document.getElementById("ww-knop").onclick = () => {
        wachtwoord = document.getElementById("ww").value;
        if (!wachtwoord) { zeg("vul het beheerwachtwoord in", "fout"); return; }
        document.getElementById("wachtwoord").classList.add("verborgen"); vorm.classList.remove("verborgen"); laad();
    };
    document.getElementById("ww").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("ww-knop").click(); });
    knopOpslaan.onclick = opslaan;
    document.getElementById("download").onclick = () => { if (T) download(); };
    window.addEventListener("beforeunload", e => { if (gewijzigd) { e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>
